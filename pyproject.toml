[project]
name = "investment-research-agents"
version = "0.1.0"
description = "A multi-agent investment research report framework."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.4.0",
    "openai>=1.0.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "rich>=13.7.0",
    "rq>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "typer>=0.12.0",
    "uvicorn>=0.32.0",
    "yfinance>=0.2.63",
]

[project.scripts]
research-agents = "research_agents.cli:app"
research-agents-worker = "research_agents.worker:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
